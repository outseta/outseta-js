name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate clients
        run: bun run generate

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Commit generated code if changed
        run: |
          paths=(packages/*/src/generated packages/api-client/src/index.ts packages/react/src/index.ts)
          [ -z "$(git status --porcelain -- "${paths[@]}")" ] || {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${paths[@]}"
            git commit -m "chore: regenerate clients from spec"
            git push
          }
