name: Sync OpenAPI Spec

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Fetch spec and regenerate
        run: bun run generate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet packages/*/src/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: bun run build

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: bun run test

      - name: Create changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          packages=""

          if git diff --quiet -- packages/api-client/src/generated; then
            :
          else
            packages="$packages\"@outseta/api-client\": patch\n"
          fi

          if git diff --quiet -- packages/react/src/generated; then
            :
          else
            packages="$packages\"@outseta/react\": patch\n"
          fi

          if [ -z "$packages" ]; then
            echo "No publishable package changes detected; skipping changeset creation."
            exit 0
          fi

          printf -- '---\n%b---\n\nUpdate API spec.\n' "$packages" > .changeset/updated-api-spec.md

      - name: Create PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: chore/sync-openapi-spec
          commit-message: "chore: sync OpenAPI spec from upstream"
          title: "chore: sync OpenAPI spec from upstream"
          body: |
            Automated PR — the upstream Outseta OpenAPI spec has changed.

            This PR regenerates all client code from the latest spec.
          labels: automated
          assignees: pierreh

      - name: Notify assignee
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh pr comment "$PR_URL" --body "@pierreh automated OpenAPI sync PR created: $PR_URL"
