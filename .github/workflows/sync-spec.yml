name: Sync OpenAPI Spec

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch spec and regenerate
        run: bun run generate

      - name: Check for changes
        id: diff
        # post-generate also rewrites the tag exports in the package barrels.
        # git status (not git diff) so new, untracked tag folders count too.
        run: |
          if [ -z "$(git status --porcelain -- packages/*/src/generated packages/api-client/src/index.ts packages/react/src/index.ts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: bun run build

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: bun run test

      - name: Create changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          packages=""

          # A changed barrel means a new API tag is exported: minor, otherwise patch.
          for pkg in api-client react; do
            if [ -n "$(git status --porcelain -- "packages/$pkg/src/index.ts")" ]; then
              packages="$packages\"@outseta/$pkg\": minor\n"
            elif [ -n "$(git status --porcelain -- "packages/$pkg/src/generated")" ]; then
              packages="$packages\"@outseta/$pkg\": patch\n"
            fi
          done

          if [ -z "$packages" ]; then
            echo "No publishable package changes detected; skipping changeset creation."
            exit 0
          fi

          printf -- '---\n%b---\n\nUpdate API spec.\n' "$packages" > .changeset/updated-api-spec.md

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/src/generated packages/api-client/src/index.ts packages/react/src/index.ts .changeset/updated-api-spec.md
          git commit -m "chore: sync OpenAPI spec from upstream"
          git push origin main
